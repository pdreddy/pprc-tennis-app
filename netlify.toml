# Frontend (the PPRC web app) on Netlify. The API is a separate service: see docs/DEPLOYMENT.md.
# Set these in Netlify > Site configuration > Environment variables (build-time, public):
#   VITE_API_BASE_URL   https://<your-api-host>        (no trailing slash)
#   VITE_PPRC_CLUB_SLUG pprc
#   VITE_FIREBASE_*     your Firebase web app config (public identifiers, not secrets)
[build]
  base = "/"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pprc/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DATA_PROVIDER = "api"
  VITE_USE_EMULATORS = "false"

# Single-page app: every unknown path serves the shell and the router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets can be cached forever; the service worker and shell must always revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
