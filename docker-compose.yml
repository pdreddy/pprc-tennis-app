services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pprc
      POSTGRES_USER: pprc
      POSTGRES_PASSWORD: pprc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pprc -d pprc"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pprc-postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pprc:pprc@postgres:5432/pprc
      PPRC_CORS_ORIGINS: http://localhost:5173
      PPRC_BOOTSTRAP_SCHEMA: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-tests:
    build: ./backend
    command: pytest -q
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pprc-postgres:
